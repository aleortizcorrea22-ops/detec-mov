<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DETEC MOV · en vivo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; min-height: 100vh; display: grid; place-items: center; font: 15px system-ui, sans-serif; color: #e2e8f0; }
  img { max-width: 100vw; max-height: 100vh; display: block; }
  .msg { padding: 24px; text-align: center; color: #94a3b8; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #16a34a; margin-right: 6px; }
  .bad .dot { background: #dc2626; }
  .status { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 999px; font-size: 12px; }
</style>
</head>
<body>
  <div id="status" class="status"><span class="dot"></span><span id="statusText">Conectando…</span></div>
  <img id="img" alt="Vista en vivo de DETEC MOV" hidden>
  <div id="msg" class="msg">Esperando que la PC mande la vista en vivo…<br>Tiene que estar vigilando para que aparezca.</div>
  <script>
    const img = document.getElementById('img');
    const msg = document.getElementById('msg');
    const status = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    let ok = 0;

    async function tick() {
      try {
        const key = new URLSearchParams(location.search).get('key');
        const qs = 't=' + Date.now() + (key ? '&key=' + encodeURIComponent(key) : '');
        const r = await fetch('/api/live.jpg?' + qs, { cache: 'no-store' });
        if (!r.ok) throw new Error();
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const old = img.src;
        img.onload = () => { if (old.startsWith('blob:')) URL.revokeObjectURL(old); };
        img.src = url;
        img.hidden = false;
        msg.hidden = true;
        status.classList.remove('bad');
        statusText.textContent = 'En vivo';
        ok++;
      } catch {
        status.classList.add('bad');
        statusText.textContent = 'Sin señal';
        if (ok === 0) { img.hidden = true; msg.hidden = false; }
      } finally {
        setTimeout(tick, 600);
      }
    }
    tick();
  </script>
</body>
</html>
